name: Testes

# Roda a cada envio para a branch main e em pull requests.
# Falha se: o gerador (tools/build.py) estiver desatualizado, houver link/arquivo quebrado,
# ou qualquer teste de navegador falhar (cronômetro, busca, offline, acessibilidade, páginas).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Gerador em dia (menus, manifesto, busca, service worker, versões)
        run: python tools/build.py --check

      - name: Testes (estáticos e de navegador)
        run: node tests/run.mjs
        env:
          BROWSER: /usr/bin/google-chrome

      # Na primeira execução no Linux o teste visual CRIA as imagens de referência (tests/baseline/linux/) e passa sem comparar.
      # Baixe este arquivo (aba da execução > Artifacts), copie para tests/baseline/linux/ e faça commit:
      # a partir daí a comparação visual vale também no GitHub.
      - name: Guardar as referências visuais criadas no Linux
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: referencias-visuais-linux
          path: tests/baseline/linux/
          if-no-files-found: ignore
